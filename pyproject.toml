[project]
name = "troll-poly-bot"
version = "0.1.0"
description = "Latency-aware paper trading bot for Polymarket 5m crypto up/down markets"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "websockets>=12.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "python-dotenv>=1.0",
    "orjson>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
research = ["pandas>=2.1", "pyarrow>=14.0", "matplotlib>=3.8"]
live = ["polymarket-client>=0.10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
